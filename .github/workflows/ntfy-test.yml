name: ntfy notification test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-test:
    runs-on: ubuntu-latest
    steps:
      - name: Validate ntfy topic
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "Missing repository secret: NTFY_TOPIC"
            exit 1
          fi
          if ! printf '%s' "$NTFY_TOPIC" | grep -Eq '^[A-Za-z0-9_-]{8,}$'; then
            echo "NTFY_TOPIC has an invalid format"
            exit 1
          fi
      - name: Send test notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl --fail --silent --show-error --retry 2 \
            -H "Title: BTC Market Monitor" \
            -H "Priority: default" \
            -H "Tags: chart_with_upwards_trend" \
            -d "GitHub Actions da gui thong bao thu thanh cong. Chua phai bao cao thi truong." \
            "https://ntfy.sh/$NTFY_TOPIC"
